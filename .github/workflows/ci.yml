name: CI Pipeline - Link-Office

on:
  push:
    branches:
      - main
      - master
      - dev
      - kwada
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - dev
      - kwada

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: linkoffice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/linkoffice_ci?schema=public"
      AUTH_SECRET: "ci-secret-key-32-characters-minimum-for-nextauth"
      CRON_SECRET: "ci-cron-secret-minimum-32-characters-for-testing"
      GROQ_API_KEY: "gsk_dummy_groq_api_key_ci_testing_123456789"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Schema to Postgres Service
        run: npx prisma db push --skip-generate

      - name: Seed Database Fixtures
        run: npx tsx prisma/seed.ts

      - name: Run ESLint
        run: npm run lint -- --quiet

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Start Background Next.js Server for HTTP Integration Tests
        run: |
          npm run dev &
          npx wait-on http://localhost:3000/api/auth/csrf -t 60000

      - name: Run Vitest test suite (Unit, Integration & Security)
        run: npm test

      - name: Build Next.js Application
        run: npm run build
